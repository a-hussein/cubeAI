[project]
name = "cubeai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.1.0",
    "numpy>=2.3.3",
    "pytest>=8.4.2",
]

[tool.ruff]
extend-exclude = [".venv", "*.ipynb"]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "cubeai",
    "ruff>=0.14.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.uv.workspace]
members = [
    ".",
    ".",
]

[tool.uv.sources]
cubeai = { workspace = true, editable = true }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
